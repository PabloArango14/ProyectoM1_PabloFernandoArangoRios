<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de colores aleatorios</title>
  </head>
  <body>
    <header>Vamos a generar colores!</header>
    <p>
      En esta página vas a poder generar colores de manera aleatoria y
      divertida. Pulsa el botón y mira la mágia!
    </p>
    <div>
      Presiona uno de estos botones para seleccionar cuántos colores quieres
      generar aleatoriamente
    </div>
    <button class="boton-seis-colores">6</button>
    <button class="boton-ocho-colores">8</button>
    <button class="boton-nueve-colores">9</button>
    <button id="botonPrincipal">Genera un color</button>
    <script src="script.js"></script>
  </body>
</html>
